# cargo-deny configuration: only permissive licenses are allowed.
[graph]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "0BSD",
  "Zlib",
  "IJG",
  "Unicode-3.0",
  "Unlicense",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
